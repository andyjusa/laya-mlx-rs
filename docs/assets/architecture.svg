<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="arch-title arch-desc"><title id="arch-title">Laya MLX Rust inference architecture</title><desc id="arch-desc">Requests flow through rendering, tokenization, checkpoint routing, ModernBERT on MLX, and a typed decision head.</desc><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#59636e"/></marker></defs><rect width="1280" height="720" fill="#f6f8fa"/><text x="64" y="76" fill="#1f2328" font-size="36" font-weight="700">One resident path from request to decision</text><text x="64" y="108" fill="#59636e" font-size="17">All MLX work stays on one dedicated inference thread.</text><rect x="52" y="160" width="1176" height="420" rx="8" fill="#1f2328" fill-opacity=".02" stroke="#1f2328" stroke-opacity=".12"/><rect x="72" y="164" width="112" height="24" fill="#f6f8fa"/><text x="128" y="181" class="mono" text-anchor="middle" fill="#6e7781" font-size="11" letter-spacing="1.5">INFERENCE</text><g fill="none" stroke="#59636e" stroke-width="3" marker-end="url(#arch-arrow)"><line x1="260" y1="372" x2="312" y2="372"/><line x1="484" y1="372" x2="536" y2="372"/><line x1="708" y1="372" x2="760" y2="372"/><line x1="932" y1="372" x2="984" y2="372"/></g><g><rect x="88" y="316" width="172" height="112" rx="6" fill="#fff" stroke="#1f2328" stroke-width="2"/><text x="174" y="362" text-anchor="middle" fill="#1f2328" font-size="18" font-weight="650">CLI / HTTP</text><text x="174" y="392" text-anchor="middle" fill="#59636e" font-size="14">JSON request</text><rect x="312" y="316" width="172" height="112" rx="6" fill="#fff" stroke="#59636e"/><text x="398" y="362" text-anchor="middle" fill="#1f2328" font-size="18" font-weight="650">Render + tokenize</text><text x="398" y="392" text-anchor="middle" fill="#59636e" font-size="14">ordered choices</text><rect x="536" y="316" width="172" height="112" rx="6" fill="#fff" stroke="#59636e"/><text x="622" y="362" text-anchor="middle" fill="#1f2328" font-size="18" font-weight="650">Language route</text><text x="622" y="392" text-anchor="middle" fill="#59636e" font-size="14">resident checkpoint</text><rect x="760" y="292" width="172" height="160" rx="6" fill="#0969da" fill-opacity=".08" stroke="#0969da" stroke-width="3"/><text x="846" y="352" text-anchor="middle" fill="#1f2328" font-size="18" font-weight="700">ModernBERT</text><text x="846" y="382" text-anchor="middle" fill="#0969da" font-size="14" font-weight="600">MLX · Metal</text><text x="846" y="412" text-anchor="middle" fill="#59636e" font-size="14">FP16 / FP32</text><rect x="984" y="316" width="172" height="112" rx="6" fill="#fff" stroke="#1f2328" stroke-width="2"/><text x="1070" y="362" text-anchor="middle" fill="#1f2328" font-size="18" font-weight="650">Decision head</text><text x="1070" y="392" text-anchor="middle" fill="#59636e" font-size="14">typed probabilities</text></g><g class="mono" fill="#6e7781" font-size="11"><text x="286" y="352" text-anchor="middle">TEXT</text><text x="510" y="352" text-anchor="middle">TOKENS</text><text x="734" y="352" text-anchor="middle">BATCH</text><text x="958" y="352" text-anchor="middle">HIDDEN</text></g></svg>
